name: Build Android APK and AAB

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_VERSION: "9.3.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Display Java and Gradle versions
        run: |
          java -version
          gradle --version

      - name: Create local environment file
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Real Supabase (anon key is a PUBLIC, RLS-protected client key) → the app
          # runs CONFIGURED: real login screen + real events/feed. Without the secrets
          # it falls back to the placeholder .env, which builds a MOCK-mode APK (no
          # login, fabricated data) — hence the loud warning so a mock build is never
          # mistaken for a real one.
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
            echo "Wrote .env from repository secrets — real Supabase (configured build)."
          elif [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
            echo "::warning::SUPABASE_URL/SUPABASE_ANON_KEY secrets are not set — building in MOCK mode from placeholders (no login, fabricated data). Add the two repo secrets for a real build."
          fi

      - name: Create temporary debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Decode release signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_STORE_PASSWORD }}
          RELEASE_KEYSTORE_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_KEY_PASSWORD }}
        run: |
          # Google Play requires the SAME upload key across every release of an
          # app. Without a real keystore, app/build.gradle.kts's
          # signingConfigs.release silently falls back to a fresh debug.keystore
          # generated a few steps above — a DIFFERENT throwaway key every run —
          # which produces an AAB/APK that LOOKS signed but can never be
          # uploaded to Play. Rather than let that happen quietly, fail here,
          # before assembleRelease/bundleRelease ever run.
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEYSTORE_KEY_PASSWORD" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_STORE_PASSWORD / RELEASE_KEYSTORE_KEY_PASSWORD repo secrets are not set. Refusing to build a release AAB/APK that would silently fall back to a throwaway debug-signed key and could never be uploaded to Play. Add the three secrets (see AGENTS.md 'Build & CI') to enable release builds."
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/release-upload-key.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            echo "KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "STORE_PASSWORD=$RELEASE_KEYSTORE_STORE_PASSWORD"
            echo "KEY_PASSWORD=$RELEASE_KEYSTORE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Decoded release upload keystore — release build will be signed with the real upload key (alias 'upload')."

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Build release AAB
        run: gradle bundleRelease --stacktrace

      - name: List generated files
        if: always()
        shell: bash
        run: |
          echo "Generated Android files:"
          find app/build/outputs \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print 2>/dev/null || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: kalfa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: kalfa-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v6
        with:
          name: kalfa-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
